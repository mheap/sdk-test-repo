
openapi: 3.1.0

info:
  title: Notifications API
  version: 1.0.0
  description: Manage notification destinations and subscriptions.

servers:
  - url: https://api.example.com/v1

tags:
  - name: Destinations
  - name: Subscriptions

paths:
  /destinations:
    get:
      x-resource: destination
      x-verb: list
      operationId: listDestinations
      summary: List destinations
      tags:
        - Destinations
      responses:
        '200':
          description: List of destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'

    post:
      x-resource: destination
      operationId: createDestination
      x-speakeasy-entity-operation: Destination#create
      summary: Create a destination
      tags:
        - Destinations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationCreate'
      responses:
        '201':
          description: Destination created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'

  /destinations/{id}:
    get:
      x-resource: destination
      operationId: getDestination
      x-speakeasy-entity-operation: Destination#read
      summary: Get a destination
      tags:
        - Destinations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-speakeasy-param-readonly: true
      responses:
        '200':
          description: Destination found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '404':
          description: The destination does not exist.

    put:
      x-resource: destination
      operationId: updateDestination
      x-speakeasy-entity-operation: Destination#update
      summary: Update a destination
      tags:
        - Destinations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-speakeasy-param-readonly: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationUpdate'
      responses:
        '200':
          description: Destination updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'

    delete:
      x-resource: destination
      operationId: deleteDestination
      x-speakeasy-entity-operation: Destination#delete
      summary: Delete a destination
      tags:
        - Destinations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-speakeasy-param-readonly: true
        - name: force
          in: query
          required: false
          description: Delete the destination and its referencing subscriptions.
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Destination deleted

  /subscriptions:
    get:
      x-resource: subscription
      x-verb: list
      operationId: listSubscriptions
      summary: List subscriptions
      tags:
        - Subscriptions
      responses:
        '200':
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'

    post:
      x-resource: subscription
      operationId: createSubscription
      x-speakeasy-entity-operation: Subscription#create
      summary: Create a subscription
      tags:
        - Subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'

  /subscriptions/{id}:
    get:
      x-resource: subscription
      operationId: getSubscription
      x-speakeasy-entity-operation: Subscription#read
      summary: Get a subscription
      tags:
        - Subscriptions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-speakeasy-param-readonly: true
      responses:
        '200':
          description: Subscription found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          description: The subscription does not exist.

    put:
      x-resource: subscription
      operationId: updateSubscription
      x-speakeasy-entity-operation: Subscription#update
      summary: Replace a subscription
      description: Replace all editable fields and retain the subscription ID.
      tags:
        - Subscriptions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-speakeasy-param-readonly: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Invalid input or unknown destination.
        '404':
          description: The subscription does not exist.

    patch:
      x-resource: subscription
      operationId: patchSubscription
      summary: Update selected subscription fields
      description: >-
        Retain omitted fields and the subscription ID. Reject empty objects and
        null values. Validate the complete result after applying the fields.
        Changing destination_type to in_app removes the previous destination_id.
        An in_app patch must not supply destination_id.
      tags:
        - Subscriptions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-speakeasy-param-readonly: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPatch'
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Invalid input or unknown destination.
        '404':
          description: The subscription does not exist.

    delete:
      x-resource: subscription
      operationId: deleteSubscription
      x-speakeasy-entity-operation: Subscription#delete
      summary: Delete a subscription
      tags:
        - Subscriptions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            x-speakeasy-param-readonly: true
      responses:
        '204':
          description: Subscription deleted

components:
  schemas:

    # ----------------------------------------
    # Destinations
    # ----------------------------------------

    Destination:
      x-speakeasy-entity: Destination
      oneOf:
        - $ref: '#/components/schemas/WebhookDestination'
        - $ref: '#/components/schemas/EmailDestination'
        - $ref: '#/components/schemas/CarrierPigeonDestination'
        - $ref: '#/components/schemas/SlackAppDestination'
      discriminator:
        propertyName: type
        mapping:
          webhook: '#/components/schemas/WebhookDestination'
          email: '#/components/schemas/EmailDestination'
          carrier_pigeon: '#/components/schemas/CarrierPigeonDestination'
          slack_app: '#/components/schemas/SlackAppDestination'

    DestinationCreate:
      x-speakeasy-entity: Destination
      oneOf:
        - $ref: '#/components/schemas/WebhookDestination'
        - $ref: '#/components/schemas/EmailDestination'
        - $ref: '#/components/schemas/CarrierPigeonDestinationCreate'
        - $ref: '#/components/schemas/SlackAppDestination'
      discriminator:
        propertyName: type
        mapping:
          webhook: '#/components/schemas/WebhookDestination'
          email: '#/components/schemas/EmailDestination'
          carrier_pigeon: '#/components/schemas/CarrierPigeonDestinationCreate'
          slack_app: '#/components/schemas/SlackAppDestination'

    DestinationUpdate:
      x-speakeasy-entity: Destination
      oneOf:
        - $ref: '#/components/schemas/WebhookDestination'
        - $ref: '#/components/schemas/EmailDestination'
        - $ref: '#/components/schemas/CarrierPigeonDestinationUpdate'
        - $ref: '#/components/schemas/SlackAppDestination'
      discriminator:
        propertyName: type
        mapping:
          webhook: '#/components/schemas/WebhookDestination'
          email: '#/components/schemas/EmailDestination'
          carrier_pigeon: '#/components/schemas/CarrierPigeonDestinationUpdate'
          slack_app: '#/components/schemas/SlackAppDestination'

    DestinationBase:
      type: object
      required:
        - id
        - name
        - type
        - enabled
        - created_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          x-speakeasy-param-readonly: true
        name:
          type: string
          example: Production Alerts
        type:
          type: string
          enum:
            - webhook
            - email
            - carrier_pigeon
            - slack_app
        enabled:
          type: boolean
          default: true
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true

    # ----------------------------------------
    # Webhook
    # ----------------------------------------

    WebhookDestination:
      allOf:
        - $ref: '#/components/schemas/DestinationBase'
        - type: object
          required:
            - config
          properties:
            type:
              type: string
              const: webhook
            config:
              $ref: '#/components/schemas/WebhookConfig'

    WebhookConfig:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        custom_headers:
          type: object
          additionalProperties:
            type: string
        retry_on:
          type: array
          items:
            type: integer

    # ----------------------------------------
    # Email
    # ----------------------------------------

    EmailDestination:
      allOf:
        - $ref: '#/components/schemas/DestinationBase'
        - type: object
          required:
            - config
          properties:
            type:
              type: string
              const: email
            config:
              $ref: '#/components/schemas/EmailConfig'

    EmailConfig:
      type: object
      required:
        - addresses
        - encoding
      properties:
        addresses:
          type: array
          items:
            type: string
            format: email
        encoding:
          type: string
          enum:
            - rich
            - plain

    # ----------------------------------------
    # Carrier Pigeon
    # ----------------------------------------

    CarrierPigeonDestination:
      allOf:
        - $ref: '#/components/schemas/DestinationBase'
        - type: object
          required:
            - config
          properties:
            type:
              type: string
              const: carrier_pigeon
            config:
              $ref: '#/components/schemas/CarrierPigeonConfig'

    CarrierPigeonDestinationCreate:
      allOf:
        - $ref: '#/components/schemas/DestinationBase'
        - type: object
          required:
            - config
          properties:
            type:
              type: string
              const: carrier_pigeon
            config:
              $ref: '#/components/schemas/CarrierPigeonConfig'

    CarrierPigeonDestinationUpdate:
      allOf:
        - $ref: '#/components/schemas/DestinationBase'
        - type: object
          required:
            - config
          properties:
            type:
              type: string
              const: carrier_pigeon
            config:
              $ref: '#/components/schemas/CarrierPigeonConfigUpdate'

    CarrierPigeonConfig:
      type: object
      required:
        - name
        - color
        - air_speed_velocity_mph
      properties:
        name:
          type: string
        color:
          type: string
        air_speed_velocity_mph:
          type: integer

    CarrierPigeonConfigUpdate:
      type: object
      required:
        - name
        - air_speed_velocity_mph
      properties:
        name:
          type: string
        air_speed_velocity_mph:
          type: integer

    # ----------------------------------------
    # Slack App
    # ----------------------------------------

    SlackAppDestination:
      allOf:
        - $ref: '#/components/schemas/DestinationBase'
        - type: object
          required:
            - config
          properties:
            type:
              type: string
              const: slack_app
            config:
              $ref: '#/components/schemas/SlackAppConfig'

    SlackAppConfig:
      type: object
      required:
        - client_id
        - client_secret
        - channel
      properties:
        client_id:
          type: string
        client_secret:
          type: string
          writeOnly: true
        channel:
          type: string

    # ----------------------------------------
    # Subscriptions
    # ----------------------------------------

    Subscription:
      x-speakeasy-entity: Subscription
      oneOf:
        - $ref: '#/components/schemas/InAppSubscription'
        - $ref: '#/components/schemas/SubscriptionWithDestination'
      discriminator:
        propertyName: destination_type
        mapping:
          in_app: '#/components/schemas/InAppSubscription'
          webhook: '#/components/schemas/SubscriptionWithDestination'
          email: '#/components/schemas/SubscriptionWithDestination'

    SubscriptionPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        event:
          type: string
        destination_type:
          type: string
          enum:
            - in_app
            - webhook
            - email
        destination_id:
          type: string
          format: uuid

    SubscriptionBase:
      type: object
      required:
        - id
        - event
        - destination_type
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event:
          type: string
        destination_type:
          type: string
          enum:
            - in_app
            - webhook
            - email

    InAppSubscription:
      x-declarative-lookup-key:
        - /event
        - /destination_type
      allOf:
        - $ref: '#/components/schemas/SubscriptionBase'
        - type: object
          properties:
            destination_type:
              type: string
              const: in_app

    SubscriptionWithDestination:
      x-declarative-lookup-key:
        - /event
        - /destination_type
        - /destination_id
      allOf:
        - $ref: '#/components/schemas/SubscriptionBase'
        - type: object
          required:
            - destination_id
          properties:
            destination_type:
              type: string
              enum:
                - webhook
                - email
            destination_id:
              type: string
              format: uuid


